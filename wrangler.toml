name = "ihoang-telegram-vps-control"
main = "src/index.ts"
compatibility_date = "2024-03-01"
account_id = "ef0cdb72b520ceb69113c4e6f3705024"


# Environment variables & secrets (Configured via `wrangler secret put <KEY>` or Cloudflare Dashboard)
# TELEGRAM_BOT_TOKEN
# TELEGRAM_SECRET_TOKEN
# ALLOWED_CHAT_IDS (Comma separated ID list e.g., "123456789,987654321")
# VPS_NODES (JSON string e.g., '[{"id":"vps1","name":"VPS Alpha","url":"https://vps1.yourdomain.com","token":"secret123"}]')

[vars]
ENVIRONMENT = "production"

# KV Namespace bindings for dynamic VPS management (Optional but recommended)
# [[kv_namespaces]]
# binding = "VPS_KV"
# id = "your_kv_namespace_id"
