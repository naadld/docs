name: Torrent Downloader Engine (Colab Rotated)

on:
  repository_dispatch:
    types: [download-torrent]

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up System Tools & Aria2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends aria2
          pip install google-api-python-client google-auth requests pyrogram tgcrypto

      - name: Execute Torrent Download & GDrive Upload via Colab Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SERVICE_ACCOUNT_EMAIL: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}
          SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.SERVICE_ACCOUNT_PRIVATE_KEY }}
          COLAB_PROFILE_1: ${{ secrets.COLAB_PROFILE_1 }}
          COLAB_PROFILE_2: ${{ secrets.COLAB_PROFILE_2 }}
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          python - << 'EOF'
          import os, sys, json, requests, subprocess, time
          from google.oauth2 import service_account
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          payload = json.loads(os.environ.get('PAYLOAD', '{}'))
          chat_id = payload.get('chat_id')
          thread_id = payload.get('thread_id', 5)
          torrent_target = payload.get('target', '')
          file_id = payload.get('file_id')
          message_id = payload.get('message_id')
          profile_index = payload.get('profile_index', 1)
          BOT_TOKEN = os.environ.get('TELEGRAM_BOT_TOKEN')

          print(f"🚀 Colab CLI Torrent Engine active using Gmail Profile #{profile_index}")

          GDRIVE_FOLDER_TORRENT = "1nXTvoes_i2nEnxyPGj1UDa_op7dyxrcc"
          status_msg_id = None
          
          def send_tg_msg(text):
              global status_msg_id
              url = f"https://api.telegram.org/bot{BOT_TOKEN}/sendMessage"
              data = {"chat_id": chat_id, "text": text, "parse_mode": "HTML"}
              if thread_id:
                  data["message_thread_id"] = thread_id
              try:
                  res = requests.post(url, data=data).json()
                  if res.get("ok"):
                      status_msg_id = res["result"]["message_id"]
                      return status_msg_id
              except Exception as ex:
                  print("Telegram send error:", ex)
              return None

          def update_tg_msg(msg_id, text):
              if not msg_id:
                  return
              url = f"https://api.telegram.org/bot{BOT_TOKEN}/editMessageText"
              data = {"chat_id": chat_id, "message_id": msg_id, "text": text, "parse_mode": "HTML"}
              try:
                  requests.post(url, data=data)
              except Exception as ex:
                  print("Telegram edit error:", ex)

          os.makedirs("torrent_work", exist_ok=True)

          # 1. Fetch Torrent payload
          torrent_input = None
          if target.startswith("magnet:"):
              torrent_input = target
          elif file_id:
              url = f"https://api.telegram.org/bot{BOT_TOKEN}/getFile?file_id={file_id}"
              res = requests.get(url).json()
              if res.get("ok"):
                  f_path = res["result"]["file_path"]
                  dl_url = f"https://api.telegram.org/file/bot{BOT_TOKEN}/{f_path}"
                  r = requests.get(dl_url)
                  tf_path = os.path.join("torrent_work", "source.torrent")
                  with open(tf_path, "wb") as f:
                      f.write(r.content)
                  torrent_input = tf_path

          if not torrent_input and message_id:
              api_id = 611335
              api_hash = "d524b507821326ef78b2352d2fd01829"
              try:
                  from pyrogram import Client
                  app = Client("pyro_bot", api_id=api_id, api_hash=api_hash, bot_token=BOT_TOKEN, in_memory=True)
                  with app:
                      msg = app.get_messages(int(chat_id), int(message_id))
                      tf_path = os.path.join("torrent_work", "source.torrent")
                      app.download_media(msg, file_name=tf_path)
                      torrent_input = tf_path
              except Exception as ex:
                  print("Pyrogram torrent download error:", ex)

          if not torrent_input:
              send_tg_msg(f"⚠️ <b>HaRi Colab CLI [Profile #{profile_index}]:</b> Invalid torrent target or magnet link.")
              sys.exit(0)

          status_id = send_tg_msg(f"⚡ <b>Colab Engine [Profile #{profile_index}]:</b> Initializing Torrent Engine...")

          # 2. Execute aria2c download with live progress updates
          out_dir = os.path.join("torrent_work", "output")
          os.makedirs(out_dir, exist_ok=True)

          aria_cmd = [
              "aria2c",
              "--dir=" + out_dir,
              "--seed-time=0",
              "--max-connection-per-server=16",
              "--split=16",
              "--min-split-size=1M",
              "--bt-stop-timeout=300",
              "--summary-interval=2",
              torrent_input
          ]

          def make_bar(pct):
              filled = int(pct / 10)
              return "█" * filled + "░" * (10 - filled)

          process = subprocess.Popen(aria_cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, bufsize=1)
          last_update_time = 0

          for line in iter(process.stdout.readline, ''):
              m = re.search(r'([\d\.]+\w+)/([\d\.]+\w+)\((\d+)%\)(?:\s+CN:\d+)?(?:\s+DL:([\d\.]+\w+))?(?:\s+ETA:([\w]+))?', line)
              if m:
                  downloaded, total, pct, speed, eta = m.groups()
                  now = time.time()
                  if now - last_update_time >= 3.5:
                      last_update_time = now
                      pct_num = int(pct)
                      bar = make_bar(pct_num)
                      progress_text = (
                          f"🚀 <b>Colab Engine [Profile #{profile_index}]: Downloading Torrent...</b>\n\n"
                          f"<code>[{bar}] {pct}%</code>\n"
                          f"⚡ <b>Speed:</b> {speed or 'N/A'} | ⏱️ <b>ETA:</b> {eta or 'Calculating...'}\n"
                          f"📦 <b>Progress:</b> {downloaded} / {total}"
                      )
                      update_tg_msg(status_id, progress_text)

          process.wait()

          # 3. Setup Google Drive Auth dynamically
          profile_secret = os.environ.get(f'COLAB_PROFILE_{profile_index}', '').strip() or os.environ.get('SERVICE_ACCOUNT_PRIVATE_KEY', '').strip()
          sa_email = os.environ.get('SERVICE_ACCOUNT_EMAIL', '')

          drive_service = None
          if profile_secret:
              try:
                  if profile_secret.startswith('{'):
                      info = json.loads(profile_secret)
                      if isinstance(info.get('refresh_token'), dict):
                          info['refresh_token'] = info['refresh_token'].get('refresh_token', '')
                      elif isinstance(info.get('refresh_token'), str) and info['refresh_token'].startswith('{'):
                          try:
                              nested = json.loads(info['refresh_token'])
                              info['refresh_token'] = nested.get('refresh_token', info['refresh_token'])
                          except Exception:
                              pass

                      if info.get('type') == 'authorized_user' or 'refresh_token' in info:
                          creds = Credentials.from_authorized_user_info(info, scopes=['https://www.googleapis.com/auth/drive'])
                      else:
                          creds = service_account.Credentials.from_service_account_info(info, scopes=['https://www.googleapis.com/auth/drive'])
                  else:
                      info = {
                          "type": "service_account",
                          "project_id": "ihoanghothihuong113",
                          "client_email": sa_email,
                          "private_key": profile_secret.replace('\\n', '\n'),
                          "token_uri": "https://oauth2.googleapis.com/token"
                      }
                      creds = service_account.Credentials.from_service_account_info(info, scopes=['https://www.googleapis.com/auth/drive'])
                  drive_service = build('drive', 'v3', credentials=creds)
                  print(f"✅ Google Drive Auth Success for Profile #{profile_index}!")
              except Exception as e:
                  print(f"GDrive Auth Error for Profile #{profile_index}:", e)

          # 4. Upload downloaded files/folder to Google Drive Torrent Folder
          downloaded_items = os.listdir(out_dir)
          if not downloaded_items:
              send_tg_msg(f"❌ <b>HaRi Colab Error [Profile #{profile_index}]:</b> Torrent download failed or timed out.")
              sys.exit(0)

          gdrive_folder_link = ""
          total_files = 0
          if drive_service:
              try:
                  # Create subfolder for torrent if multiple items
                  first_item = os.path.join(out_dir, downloaded_items[0])
                  if os.path.isdir(first_item) or len(downloaded_items) > 1:
                      folder_name = downloaded_items[0] if os.path.isdir(first_item) else "Torrent_Download"
                      folder_metadata = {'name': folder_name, 'mimeType': 'application/vnd.google-apps.folder', 'parents': [GDRIVE_FOLDER_TORRENT]}
                      f_res = drive_service.files().create(body=folder_metadata, fields='id, webViewLink').execute()
                      target_parent = f_res.get('id')
                      gdrive_folder_link = f_res.get('webViewLink', '')

                      for root, dirs, files in os.walk(out_dir):
                          for fname in files:
                              fpath = os.path.join(root, fname)
                              media = MediaFileUpload(fpath, resumable=True)
                              drive_service.files().create(body={'name': fname, 'parents': [target_parent]}, media_body=media).execute()
                              total_files += 1
                  else:
                      fname = os.path.basename(first_item)
                      media = MediaFileUpload(first_item, resumable=True)
                      f_res = drive_service.files().create(body={'name': fname, 'parents': [GDRIVE_FOLDER_TORRENT]}, media_body=media, fields='id, webViewLink').execute()
                      gdrive_folder_link = f_res.get('webViewLink', '')
                      total_files = 1
              except Exception as gerr:
                  print("GDrive Torrent Upload Error:", gerr)

          safe_link = gdrive_folder_link.replace('&', '&amp;')
          report = f"✅ <b>HARI COLAB TASK COMPLETED [Profile #{profile_index}]: [TORRENT DOWNLOAD]</b>\n\n🧲 <b>Target:</b> <code>{os.path.basename(downloaded_items[0])}</code>\n📦 <b>Files Uploaded:</b> {total_files} file(s)\n" + (f"📁 <b>GDrive Folder:</b> <a href=\"{safe_link}\">Open Downloaded Torrent in Google Drive</a>" if safe_link else "")
          send_tg_msg(report)

          EOF
