name: Media Downloader Engine (Colab Rotated)

on:
  repository_dispatch:
    types: [download-media]

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up System Tools & yt-dlp & ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          pip install --upgrade yt-dlp google-api-python-client google-auth requests pyrogram tgcrypto

      - name: Execute Media Download & GDrive Upload via Colab Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SERVICE_ACCOUNT_EMAIL: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}
          SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.SERVICE_ACCOUNT_PRIVATE_KEY }}
          COLAB_PROFILE_1: ${{ secrets.COLAB_PROFILE_1 }}
          COLAB_PROFILE_2: ${{ secrets.COLAB_PROFILE_2 }}
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          python - << 'EOF'
          import os, sys, json, requests, subprocess, glob
          from google.oauth2 import service_account
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          payload = json.loads(os.environ.get('PAYLOAD', '{}'))
          chat_id = payload.get('chat_id')
          thread_id = payload.get('thread_id', 6)
          media_url = payload.get('url', '')
          action = payload.get('action', 'video')
          profile_index = payload.get('profile_index', 1)
          BOT_TOKEN = os.environ.get('TELEGRAM_BOT_TOKEN')

          print(f"🚀 Colab CLI Media Engine active using Gmail Profile #{profile_index}")

          GDRIVE_FOLDER_MEDIA = "1itDlaeJyzmp6m91RDtU6WzwhpL3Hq9pD"

          status_msg_id = None

          def send_tg_msg(text):
              global status_msg_id
              url = f"https://api.telegram.org/bot{BOT_TOKEN}/sendMessage"
              data = {"chat_id": chat_id, "text": text, "parse_mode": "HTML", "disable_web_page_preview": True}
              if thread_id:
                  data["message_thread_id"] = int(thread_id)
              try:
                  res = requests.post(url, json=data).json()
                  if res.get("ok"):
                      status_msg_id = res["result"]["message_id"]
                      return status_msg_id
              except Exception as ex:
                  print("Telegram send error:", ex)
              return None

          def update_tg_msg(msg_id, text):
              if not msg_id:
                  return
              url = f"https://api.telegram.org/bot{BOT_TOKEN}/editMessageText"
              data = {"chat_id": chat_id, "message_id": msg_id, "text": text, "parse_mode": "HTML", "disable_web_page_preview": True}
              try:
                  requests.post(url, json=data)
              except Exception as ex:
                  print("Telegram edit error:", ex)

          def send_tg_doc(doc_path, caption):
              url = f"https://api.telegram.org/bot{BOT_TOKEN}/sendDocument"
              data = {"chat_id": str(chat_id), "caption": caption, "parse_mode": "HTML"}
              if thread_id:
                  data["message_thread_id"] = int(thread_id)
              with open(doc_path, 'rb') as f:
                  files = {"document": (os.path.basename(doc_path), f)}
                  res = requests.post(url, data=data, files=files)
                  return res.json().get('ok', False)

          if not media_url:
              send_tg_msg(f"⚠️ <b>HaRi Colab CLI [Profile #{profile_index}]:</b> Invalid media link.")
              sys.exit(0)

          status_id = send_tg_msg(f"⚡ <b>Colab Engine [Profile #{profile_index}]:</b> Initializing Media Downloader...")

          out_dir = os.path.join("media_work", "output")
          os.makedirs(out_dir, exist_ok=True)
          out_template = os.path.join(out_dir, "%(title)s.%(ext)s")

          # 1. Build yt-dlp Command based on Action
          cmd = ["yt-dlp", "--no-warnings", "--ignore-errors", "-o", out_template]

          is_audio = 'mp3' in action
          is_playlist = 'pl' in action

          if not is_playlist:
              cmd.append("--no-playlist")

          if is_audio:
              cmd.extend(["-x", "--audio-format", "mp3", "--audio-quality", "0"])
          else:
              cmd.extend(["-f", "bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best", "--merge-output-format", "mp4"])

          cmd.append(media_url)

          def make_bar(pct):
              filled = int(pct / 10)
              return "█" * filled + "░" * (10 - filled)

          import re, time
          process = subprocess.Popen(cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, bufsize=1)
          last_update_time = 0
          cur_item = None
          tot_items = None

          for line in iter(process.stdout.readline, ''):
              item_match = re.search(r'\[download\]\s+Downloading\s+(?:item|video)\s+(\d+)\s+of\s+(\d+)', line, re.IGNORECASE)
              if item_match:
                  cur_item, tot_items = item_match.groups()

              m = re.search(r'\[download\]\s+([\d\.]+)%\s+of\s+~?([\d\.]+\w+)(?:\s+at\s+([\d\.]+\w+/s))?(?:\s+ETA\s+([\d:]+))?', line)
              if m:
                  pct, total, speed, eta = m.groups()
                  now = time.time()
                  if now - last_update_time >= 3.5:
                      last_update_time = now
                      pct_float = float(pct)
                      bar = make_bar(int(pct_float))
                      playlist_info = f"\n📌 <b>Playlist Item:</b> #{cur_item} / {tot_items}" if cur_item and tot_items else ""
                      progress_text = (
                          f"🎬 <b>Colab Engine [Profile #{profile_index}]: Downloading Media...</b>{playlist_info}\n\n"
                          f"<code>[{bar}] {pct_float:.1f}%</code>\n"
                          f"⚡ <b>Speed:</b> {speed or 'N/A'} | ⏱️ <b>ETA:</b> {eta or 'Calculating...'}\n"
                          f"📦 <b>Size:</b> {total}"
                      )
                      update_tg_msg(status_id, progress_text)

          process.wait()

          # 2. Setup Google Drive Credentials dynamically (Supports OAuth2 Authorized User Refresh Token or Service Account)
          profile_secret = os.environ.get(f'COLAB_PROFILE_{profile_index}', '').strip() or os.environ.get('SERVICE_ACCOUNT_PRIVATE_KEY', '').strip()
          sa_email = os.environ.get('SERVICE_ACCOUNT_EMAIL', '')

          drive_service = None
          if profile_secret:
              try:
                  if profile_secret.startswith('{'):
                      info = json.loads(profile_secret)
                      if isinstance(info.get('refresh_token'), dict):
                          info['refresh_token'] = info['refresh_token'].get('refresh_token', '')
                      elif isinstance(info.get('refresh_token'), str) and info['refresh_token'].startswith('{'):
                          try:
                              nested = json.loads(info['refresh_token'])
                              info['refresh_token'] = nested.get('refresh_token', info['refresh_token'])
                          except Exception:
                              pass

                      if info.get('type') == 'authorized_user' or 'refresh_token' in info:
                          creds = Credentials.from_authorized_user_info(info, scopes=['https://www.googleapis.com/auth/drive'])
                      else:
                          creds = service_account.Credentials.from_service_account_info(info, scopes=['https://www.googleapis.com/auth/drive'])
                  else:
                      info = {
                          "type": "service_account",
                          "project_id": "ihoanghothihuong113",
                          "client_email": sa_email,
                          "private_key": profile_secret.replace('\\n', '\n'),
                          "token_uri": "https://oauth2.googleapis.com/token"
                      }
                      creds = service_account.Credentials.from_service_account_info(info, scopes=['https://www.googleapis.com/auth/drive'])
                  drive_service = build('drive', 'v3', credentials=creds)
                  print(f"✅ Google Drive Auth Success for Profile #{profile_index}!")
              except Exception as e:
                  print(f"GDrive Auth Error for Profile #{profile_index}:", e)

          # 3. Upload downloaded media to Google Drive Media Folder
          media_files = [os.path.join(out_dir, f) for f in os.listdir(out_dir) if os.path.isfile(os.path.join(out_dir, f))]
          if not media_files:
              send_tg_msg(f"❌ <b>HaRi Colab Error [Profile #{profile_index}]:</b> Could not download media file.")
              sys.exit(0)

          gdrive_link = ""
          total_files = len(media_files)

          if drive_service:
              try:
                  if total_files > 1:
                      # Create subfolder for playlist
                      folder_metadata = {'name': 'Media_Playlist_Download', 'mimeType': 'application/vnd.google-apps.folder', 'parents': [GDRIVE_FOLDER_MEDIA]}
                      f_res = drive_service.files().create(body=folder_metadata, fields='id, webViewLink').execute()
                      target_parent = f_res.get('id')
                      gdrive_link = f_res.get('webViewLink', '')

                      for mf in media_files:
                          mtype = 'audio/mpeg' if mf.endswith('.mp3') else 'video/mp4'
                          media = MediaFileUpload(mf, mimetype=mtype, resumable=True)
                          drive_service.files().create(body={'name': os.path.basename(mf), 'parents': [target_parent]}, media_body=media).execute()
                  else:
                      first_file = media_files[0]
                      fname = os.path.basename(first_file)
                      mtype = 'audio/mpeg' if first_file.endswith('.mp3') else 'video/mp4'
                      media = MediaFileUpload(first_file, mimetype=mtype, resumable=True)
                      f_res = drive_service.files().create(body={'name': fname, 'parents': [GDRIVE_FOLDER_MEDIA]}, media_body=media, fields='id, webViewLink').execute()
                      gdrive_link = f_res.get('webViewLink', '')
              except Exception as gerr:
                  print("GDrive Media Upload Error:", gerr)

          safe_link = gdrive_link.replace('&', '&amp;')
          first_name = os.path.basename(media_files[0])
          caption = f"✅ <b>HARI COLAB TASK COMPLETED [Profile #{profile_index}]: [MEDIA DOWNLOADER]</b>\n\n📄 <b>Downloaded:</b> <code>{first_name}</code>\n📦 <b>Files:</b> {total_files} file(s)\n" + (f"📁 <b>GDrive:</b> <a href=\"{safe_link}\">Open Media File in Google Drive</a>" if safe_link else "")

          # Send smaller file (< 50MB) directly to Telegram as attachment as well!
          first_size = os.path.getsize(media_files[0])
          if first_size < 45 * 1024 * 1024:
              if not send_tg_doc(media_files[0], caption):
                  send_tg_msg(caption)
          else:
              send_tg_msg(caption)

          EOF
